# Separate SystemVerilog UVM execution gate. Latest Verilator 5.054 with the
# Accellera 1800.2-2020.3.2 library included by the tool distributor.
# This job performs ACTUAL UVM elaboration/simulation (unlike uvm-audit).
name: Full SV UVM Prototype Regression
on:
  push:
    branches: [feature/g1-testbench-v0.3]
  pull_request:
  workflow_dispatch:
jobs:
  uvm-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make g++ python3
      - name: Install version-pinned Verilator and UVM
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/EDAPack/verilator-bin/releases/download/v5.054/verilator-manylinux_2_28_x86_64-5.054.tar.gz' \
            -o /tmp/verilator-bin.tar.gz
          mkdir -p build/verilator
          tar -xzf /tmp/verilator-bin.tar.gz -C build/verilator
          VERILATOR_PATH="$(find "$GITHUB_WORKSPACE/build/verilator" -type f -name verilator | head -1)"
          if [ -z "$VERILATOR_PATH" ]; then
            VERILATOR_PATH="$(find "$GITHUB_WORKSPACE/build/verilator" -name verilator -type l | head -1)"
          fi
          [ -n "$VERILATOR_PATH" ]
          PREFIX="$(dirname "$(dirname "$VERILATOR_PATH")")"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          echo "UVM_HOME=$PREFIX/share/uvm" >> "$GITHUB_ENV"
          "$PREFIX/bin/verilator" --version
          test -f "$PREFIX/share/uvm/src/uvm_pkg.sv"
      - name: Compile and run UVM smoke test
        run: SIM=verilator UVM_TESTNAME=pcie_g6_smoke_test make tb-uvm
      - name: Run remaining UVM scenarios on the same build
        run: |
          set -e
          for t in pcie_g6_random_test pcie_g6_negative_test pcie_g6_linkloss_test pcie_g6_width_test; do
            UVM_SKIP_BUILD=1 SEED=17 SIM=verilator UVM_TESTNAME="$t" bash tb/scripts/run_uvm.sh
          done
      - name: Upload UVM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvm-failure-logs
          path: |
            build/uvm/compile.log
            build/uvm/sim.log
          if-no-files-found: ignore
